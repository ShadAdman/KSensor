<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accentSuccess" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" rx="16" />

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="-0.5">KSensor Live Benchmarking Dashboard</text>
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="15" fill="#94A3B8">Real-time Throughput, Sub-Millisecond Latency &amp; Memory Telemetry across Android &amp; iOS</text>
  </g>

  <!-- Top Metric Cards -->
  <!-- Card 1: Event Throughput -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="260" height="110" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">TOTAL EVENT RATE</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#10B981">12,450 <tspan font-size="16" font-weight="600" fill="#6EE7B7">events/s</tspan></text>
    <circle cx="225" cy="35" r="12" fill="#10B981" fill-opacity="0.2" />
    <path d="M220 38 L225 31 L230 38" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Card 2: Average Latency -->
  <g transform="translate(320, 110)" filter="url(#shadow)">
    <rect width="260" height="110" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">AVG EVENT LATENCY</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#6366F1">0.38 <tspan font-size="16" font-weight="600" fill="#A5B4FC">ms</tspan></text>
    <circle cx="225" cy="35" r="12" fill="#6366F1" fill-opacity="0.2" />
    <path d="M220 35 L224 39 L230 31" stroke="#6366F1" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Card 3: Memory Usage -->
  <g transform="translate(600, 110)" filter="url(#shadow)">
    <rect width="260" height="110" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">MEMORY OVERHEAD</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#06B6D4">1.42 <tspan font-size="16" font-weight="600" fill="#67E8F9">MB Heap</tspan></text>
    <circle cx="225" cy="35" r="12" fill="#06B6D4" fill-opacity="0.2" />
    <circle cx="225" cy="35" r="5" fill="#06B6D4" />
  </g>

  <!-- Card 4: Active Streams -->
  <g transform="translate(880, 110)" filter="url(#shadow)">
    <rect width="280" height="110" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">ACTIVE PLUGINS</text>
    <text x="20" y="72" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#F59E0B">16 <tspan font-size="16" font-weight="600" fill="#FDE68A">Streams Active</tspan></text>
    <circle cx="245" cy="35" r="12" fill="#F59E0B" fill-opacity="0.2" />
    <path d="M240 35 L250 35" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Main Chart Section: Per-Plugin Throughput -->
  <g transform="translate(40, 245)" filter="url(#shadow)">
    <rect width="680" height="385" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="36" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Sensor Plugin Event Frequency (Hz / EPS)</text>
    <text x="24" y="56" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Live sampling throughput per second across active plugins</text>

    <!-- Bar 1: Accelerometer -->
    <g transform="translate(24, 85)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Accelerometer</text>
      <rect x="140" y="2" width="460" height="20" rx="4" fill="#1E293B" />
      <rect x="140" y="2" width="420" height="20" rx="4" fill="url(#accentPrimary)" />
      <text x="570" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">100.0 Hz</text>
    </g>

    <!-- Bar 2: Gyroscope -->
    <g transform="translate(24, 130)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Gyroscope</text>
      <rect x="140" y="2" width="460" height="20" rx="4" fill="#1E293B" />
      <rect x="140" y="2" width="380" height="20" rx="4" fill="url(#accentCyan)" />
      <text x="570" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#67E8F9">90.0 Hz</text>
    </g>

    <!-- Bar 3: Touch Gestures -->
    <g transform="translate(24, 175)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Touch Gestures</text>
      <rect x="140" y="2" width="460" height="20" rx="4" fill="#1E293B" />
      <rect x="140" y="2" width="320" height="20" rx="4" fill="url(#accentSuccess)" />
      <text x="570" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6EE7B7">60.0 Hz</text>
    </g>

    <!-- Bar 4: Magnetometer -->
    <g transform="translate(24, 220)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Magnetometer</text>
      <rect x="140" y="2" width="460" height="20" rx="4" fill="#1E293B" />
      <rect x="140" y="2" width="280" height="20" rx="4" fill="#8B5CF6" />
      <text x="570" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#C4B5FD">50.0 Hz</text>
    </g>

    <!-- Bar 5: Heart Rate PPG -->
    <g transform="translate(24, 265)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Heart Rate PPG</text>
      <rect x="140" y="2" width="460" height="20" rx="4" fill="#1E293B" />
      <rect x="140" y="2" width="210" height="20" rx="4" fill="#EC4899" />
      <text x="570" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBCFE8">30.0 Hz</text>
    </g>

    <!-- Bar 6: Location & Status -->
    <g transform="translate(24, 310)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">Location &amp; Status</text>
      <rect x="140" y="2" width="460" height="20" rx="4" fill="#1E293B" />
      <rect x="140" y="2" width="90" height="20" rx="4" fill="#F59E0B" />
      <text x="570" y="17" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDE68A">10.0 Hz</text>
    </g>
  </g>

  <!-- Side Section: Latency & Memory Breakdown -->
  <g transform="translate(740, 245)" filter="url(#shadow)">
    <rect width="420" height="385" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="36" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Latency Distribution (ms)</text>
    <text x="24" y="56" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Emission-to-collector delay across platforms</text>

    <!-- Latency Curve Graph -->
    <g transform="translate(24, 80)">
      <path d="M0 120 Q 40 115, 80 40 T 160 100 T 240 115 T 320 120 T 370 120" fill="url(#chartGrad)" stroke="#6366F1" stroke-width="3" />
      <line x1="0" y1="120" x2="370" y2="120" stroke="#334155" stroke-width="1" />

      <!-- Graph Points -->
      <circle cx="80" cy="40" r="5" fill="#10B981" />
      <text x="80" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Min 0.12 ms</text>

      <circle cx="160" cy="100" r="5" fill="#6366F1" />
      <text x="160" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC" text-anchor="middle">Avg 0.38 ms</text>

      <circle cx="240" cy="115" r="5" fill="#F59E0B" />
      <text x="240" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">Max 1.05 ms</text>
    </g>

    <!-- Platform Verification Badges -->
    <g transform="translate(24, 250)">
      <rect width="370" height="110" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Platform Zero-Overhead Guarantee</text>

      <g transform="translate(16, 45)">
        <rect width="165" height="28" rx="4" fill="#1E293B" />
        <text x="12" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">🤖 Android: 0.35 ms Avg</text>
      </g>
      <g transform="translate(190, 45)">
        <rect width="165" height="28" rx="4" fill="#1E293B" />
        <text x="12" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#A7F3D0">🍎 iOS: 0.41 ms Avg</text>
      </g>
      <text x="16" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Non-blocking Coroutine Flow pipeline with zero allocation overhead.</text>
    </g>
  </g>
</svg>
